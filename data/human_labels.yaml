- id: reasoning_001
  question: What is the difference between cold blooded and warm blooded animals?
  expected: Cold blooded animals rely on external sources for body heat, while warm blooded animals maintain a constant internal body temperature.
  frozen_output: 'The terms "cold-blooded" and "warm-blooded" are outdated and can be misleading. The correct terminology is "ectothermic" (cold-blooded) and "endothermic" (warm-blooded).


    **Ectothermic (Cold-Blooded) Animals:**


    Ectothermic animals, also known as cold-blooded animals, rely on external sources of heat to regulate their body temperature. Their metabolic rate is influenced by the environment, and they often bask in sunlight or seek shade to maintain a stable body temperature.


    Examples of ectothermic animals include:


    * Reptiles (snakes, lizards, turtles)

    * Amphibians (frogs, toads)

    * Fish

    * Insects (most species)


    **Endothermic (Warm-Blooded) Animals:**


    Endothermic animals, also known as warm-blooded animals, generate heat internally and maintain a relatively constant body temperature regardless of the environment. This allows them to be active in a wider range of temperatures.


    Examples of endothermic animals include:


    * Mammals (humans, dogs, cats)

    * Birds

    * Some species of fish (such as goldfish)


    Key differences between ectothermic and endothermic animals:


    1. **Body temperature regulation:** Ectothermic animals rely on external sources of heat, while endothermic animals generate heat internally.

    2. **Metabolic rate:** Endothermic animals have a higher metabolic rate than ectothermic animals, which allows them to maintain their body temperature.

    3. **Activity range:** Endothermic animals can be active in a wider range of temperatures than ectothermic animals.

    4. **Energy efficiency:** Ectothermic animals often require more energy to maintain their body temperature, while endothermic animals are generally more energy-efficient.


    It''s worth noting that the terms "cold-blooded" and "warm-blooded" were historically used to describe these two groups of animals, but they can be misleading and have been largely replaced by the more accurate terms ectothermic and endothermic.'
  human_verdict: PASS
