[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Pytest-based evaluation harness for LLM systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "ollama: requires a real Ollama instance at localhost:11434 (slow)",
    "mocked: uses respx to mock Ollama (fast)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]
